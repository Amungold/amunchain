[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "LGPL-2.1-or-later",
    "Apache-2.0 WITH LLVM-exception",
    "AGPL-3.0-or-later",
    "NCSA",
]
exceptions = []

[advisories]
ignore = [
    "RUSTSEC-2023-0089",
]
