name: Constitutional Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
jobs:
  constitutional-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Verify Constitutional Fingerprint
        run: |
          bash tools/constitutional-fingerprint.sh > /tmp/current-fingerprint.txt
          if ! diff -q docs/architecture/CONSTITUTIONAL_FINGERPRINT.txt /tmp/current-fingerprint.txt; then
            echo "❌ CONSTITUTIONAL FINGERPRINT MISMATCH"
            echo "Run: bash tools/constitutional-fingerprint.sh > docs/architecture/CONSTITUTIONAL_FINGERPRINT.txt"
            diff -u docs/architecture/CONSTITUTIONAL_FINGERPRINT.txt /tmp/current-fingerprint.txt || true
            exit 1
          fi
          echo "✅ Constitutional fingerprint verified"
      - name: Dependency Constitution Audit (grep)
        run: bash tools/audit-deps.sh
      - name: Constitutional Linter (graph)
        run: cargo run -p constitutional-linter
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace 2>&1 | tail -5
      - name: Test
        run: cargo test --workspace 2>&1 | grep -E "test result" | tail -5
