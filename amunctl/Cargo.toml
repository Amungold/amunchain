[package]
name = "amunctl"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AmunChain Orchestrator CLI — manage the entire network from one command"

[[bin]]
name = "amunctl"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
async-trait = "0.1"
amun-orchestrator-core = { path = "../crates/amun-orchestrator-core" }
amun-orchestrator-builder = { path = "../crates/amun-orchestrator-builder" }
amun-orchestrator-validator = { path = "../crates/amun-orchestrator-validator" }
amun-orchestrator-genesis = { path = "../crates/amun-orchestrator-genesis" }
amun-orchestrator-certificates = { path = "../crates/amun-orchestrator-certificates" }
amun-orchestrator-service = { path = "../crates/amun-orchestrator-service" }
amun-orchestrator-health = { path = "../crates/amun-orchestrator-health" }
amun-orchestrator-deploy = { path = "../crates/amun-orchestrator-deploy" }
amun-orchestrator-scaling = { path = "../crates/amun-orchestrator-scaling" }
clap = { version = "4", features = ["derive", "color"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
