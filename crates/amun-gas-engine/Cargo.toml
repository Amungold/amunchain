[package]
name = "amun-gas-engine"
version = "0.1.0"
edition = "2021"
description = "Constitutional gas engine — metering, exhaustion, evidence"
license = "MIT OR Apache-2.0"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
amun-vm-kernel = { path = "../amun-vm-kernel" }
amun-evidence-engine = { path = "../amun-evidence-engine" }
amun-bytecode = { path = "../amun-bytecode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "2"
