[package]
name = "amun-validator-runtime"
version = "0.1.0"
edition = "2021"
description = "Multi-node validator runtime and cluster"
license = "MIT OR Apache-2.0"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
amun-vm-kernel = { path = "../amun-vm-kernel" }
amun-bytecode = { path = "../amun-bytecode" }
amun-constitutional-runtime = { path = "../amun-constitutional-runtime" }
amun-replay-consensus = { path = "../amun-replay-consensus" }
amun-persistent-node = { path = "../amun-persistent-node" }
amun-proof-archive = { path = "../amun-proof-archive" }
amun-operations = { path = "../amun-operations" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "1"
tempfile = "3"
