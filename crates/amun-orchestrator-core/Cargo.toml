[package]
name = "amun-orchestrator-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Amun Orchestrator Core — event-driven self-managing blockchain platform"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"

[dev-dependencies]
tempfile = "3"
