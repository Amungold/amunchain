[package]
name = "amun-peer-identity"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Constitutional peer identity — lineage-bound identity for sovereign network actors"

[dependencies]
amun-constitutional-authority = { path = "../amun-constitutional-authority" }
amun-constitutional-signing = { path = "../amun-constitutional-signing" }
amun-constitutional-block = { path = "../amun-constitutional-block" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
