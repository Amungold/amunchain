[package]
name = "amun-rpc"
version = "0.1.0"
edition = "2021"
description = "Live RPC server for AmunChain validators"

[dependencies]
amun-chain-store = { path = "../amun-chain-store" }
amun-consensus-network = { path = "../amun-consensus-network" }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

