[package]
name = "amun-rpc"
version = "3.0.0"
edition = "2021"
description = "AmunChain JSON-RPC with auth and rate limiting"

[dependencies]
amun-host = { path = "../amun-host" }
amun-crypto = { path = "../amun-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1.5", default-features = false }
subtle = "2"
heapless = "0.8"
