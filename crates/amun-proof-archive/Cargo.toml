[package]
name = "amun-proof-archive"
version = "0.1.0"
edition = "2021"
description = "Two-tier proof storage: hot store + constitutional evidence archive"
license = "MIT OR Apache-2.0"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
amun-transition-proof = { path = "../amun-transition-proof" }
amun-evidence-engine = { path = "../amun-evidence-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "1"
