[package]
name = "amun-explorer-api"
version = "0.1.0"
edition = "2021"
description = "Constitutional Explorer API for AmunChain — blocks, finality, evidence, verdicts"
license = "MIT OR Apache-2.0"

[dependencies]
amun-constitutional-proof = { path = "../amun-constitutional-proof" }
amun-verification-kernel = { path = "../amun-verification-kernel" }
amun-rpc = { path = "../amun-rpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
blake3 = "1"
hex = "0.4"

[[bin]]
name = "amun-explorer-api"
path = "src/main.rs"

