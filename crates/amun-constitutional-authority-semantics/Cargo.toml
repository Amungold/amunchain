[package]
name = "amun-constitutional-authority-semantics"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Constitutional authority semantics — delegation, revocation, institutional witnesses"

[dependencies]
amun-constitutional-signing = { path = "../amun-constitutional-signing" }
amun-constitutional-authority = { path = "../amun-constitutional-authority" }
amun-peer-identity = { path = "../amun-peer-identity" }
amun-constitution-builder = { path = "../amun-constitution-builder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
