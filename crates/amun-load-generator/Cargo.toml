[package]
name = "amun-load-generator"
version = "0.1.0"
edition = "2021"
description = "Transaction load generator for AmunChain benchmarks"
license = "MIT OR Apache-2.0"

[dependencies]
amun-mempool-gossip = { path = "../amun-mempool-gossip" }
amun-live-cluster = { path = "../amun-live-cluster" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
rand = "0.8"
tempfile = "3"
