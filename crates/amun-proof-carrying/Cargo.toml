[package]
name = "amun-proof-carrying"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Proof-carrying execution receipts with SMT proofs for stateless verification"

[dependencies]
amun-constitutional-kernel = { path = "../amun-constitutional-kernel" }
amun-constitutional-commitments = { path = "../amun-constitutional-commitments" }
amun-constitutional-block = { path = "../amun-constitutional-block" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
