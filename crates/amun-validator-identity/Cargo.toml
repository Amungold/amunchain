[package]
name = "amun-validator-identity"
version = "0.1.0"
edition = "2021"
description = "Validator identity: key derivation, registry, and vote signature verification"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
rand = "0.8"
