[package]
name = "amun-constitutional-signing"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Constitutional signing with Ed25519"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
amun-constitution-builder = { path = "../amun-constitution-builder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
