[package]
name = "amun-mempool"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "Constitutional mempool for pending transactions"

[dependencies]
ed25519-dalek = "2"
rand = "0.8"
amun-transactions = { path = "../amun-transactions" }
serde = { version = "1", features = ["derive"] }
