[package]
name = "amun-validator-storage"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AmunChain Validator Storage Service — Mainnet-grade WAL, snapshots, metadata, recovery"

[dependencies]
amun-validator-api = { path = "../amun-validator-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
