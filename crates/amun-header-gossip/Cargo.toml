[package]
name = "amun-header-gossip"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Constitutional header gossip network"

[dependencies]
amun-constitutional-block = { path = "../amun-constitutional-block" }
amun-verifier-node = { path = "../amun-verifier-node" }
amun-light-client = { path = "../amun-light-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
amun-constitutional-kernel = { path = "../amun-constitutional-kernel" }
amun-constitutional-commitments = { path = "../amun-constitutional-commitments" }
