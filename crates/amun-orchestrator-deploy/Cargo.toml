[package]
name = "amun-orchestrator-deploy"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Deployment Engine — testnet/mainnet promotion, rolling upgrades, rollback"

[dependencies]
amun-orchestrator-core = { path = "../amun-orchestrator-core" }
amun-orchestrator-builder = { path = "../amun-orchestrator-builder" }
amun-orchestrator-validator = { path = "../amun-orchestrator-validator" }
amun-orchestrator-genesis = { path = "../amun-orchestrator-genesis" }
amun-orchestrator-certificates = { path = "../amun-orchestrator-certificates" }
amun-orchestrator-service = { path = "../amun-orchestrator-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "process", "time"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
