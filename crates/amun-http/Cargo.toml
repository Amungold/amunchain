[package]
name = "amun-http"
version = "3.0.0"
edition = "2021"
description = "AmunChain HTTP server"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls = "0.23"
serde_json = "1"
bytes = "1"
amun-rpc = { path = "../amun-rpc" }
