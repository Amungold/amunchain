[package]
name = "amun-replay-cert"
version = "1.0.0"
edition = "2021"
description = "AmunChain deterministic replay certification framework"

[dependencies]
amun-truth-engine = { path = "../amun-truth-engine" }
amun-canonical = { path = "../amun-canonical" }
amun-deterministic-allocator = { path = "../amun-deterministic-allocator" }
amun-chain-context = { path = "../amun-chain-context" }
blake3 = { version = "1.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
