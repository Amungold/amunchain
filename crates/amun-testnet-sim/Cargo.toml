[package]
name = "amun-testnet-sim"
version = "0.1.0"
edition = "2021"
description = "Byzantine and adversarial testnet simulation"
license = "MIT OR Apache-2.0"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
amun-vm-kernel = { path = "../amun-vm-kernel" }
amun-constitutional-runtime = { path = "../amun-constitutional-runtime" }
amun-replay-verifier = { path = "../amun-replay-verifier" }
amun-replay-consensus = { path = "../amun-replay-consensus" }
amun-state-sync = { path = "../amun-state-sync" }
amun-validator-networking = { path = "../amun-validator-networking" }
amun-bytecode = { path = "../amun-bytecode" }
amun-pccv = { path = "../amun-pccv" }
amun-proof-archive = { path = "../amun-proof-archive" }
amun-transition-proof = { path = "../amun-transition-proof" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
rand = "0.8"
