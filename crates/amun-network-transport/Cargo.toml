[package]
name = "amun-network-transport"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Real network transport layer (TCP, message framing, peer connections)"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
hex = "0.4"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
