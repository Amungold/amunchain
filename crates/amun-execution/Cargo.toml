[package]
name = "amun-execution"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "Constitutional transaction execution engine for AmunChain"

[dependencies]
amun-transactions = { path = "../amun-transactions" }
amun-accounts = { path = "../amun-accounts" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ed25519-dalek = "2"
rand = "0.8"
