[package]
name = "amun-crypto-hardening"
version = "0.1.0"
edition = "2021"
description = "Production-grade cryptographic hardening — Ed25519, BLS, anti-replay, key rotation"
license = "MIT OR Apache-2.0"

[dependencies]
ed25519-dalek = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
blake3 = "1"
hex = "0.4"
thiserror = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
