[package]
name = "amun-constitutional-kernel"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Constitutional execution kernel: deterministic state transitions, capability enforcement, amendment activation"

[dependencies]
amun-constitution-builder = { path = "../amun-constitution-builder" }
amun-constitutional-signing = { path = "../amun-constitutional-signing" }
amun-constitutional-authority = { path = "../amun-constitutional-authority" }
amun-constitutional-governance = { path = "../amun-constitutional-governance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
