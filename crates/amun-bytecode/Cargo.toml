[package]
name = "amun-bytecode"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Constitutional bytecode — resource-aware opcodes for the VM"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
amun-vm-kernel = { path = "../amun-vm-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "2"
