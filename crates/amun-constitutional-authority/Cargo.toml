[package]
name = "amun-constitutional-authority"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Constitutional authority layer: certificate chains, revocation, rotation, trust anchors"

[dependencies]
amun-constitution-builder = { path = "../amun-constitution-builder" }
amun-constitutional-signing = { path = "../amun-constitutional-signing" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
