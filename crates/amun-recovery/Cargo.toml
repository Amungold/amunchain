[package]
name = "amun-recovery"
version = "0.1.0"
edition = "2021"
description = "Constitutional full node recovery orchestrator"
license = "MIT OR Apache-2.0"

[dependencies]
amun-persistence = { path = "../amun-persistence" }
amun-snapshot-engine-unified = { path = "../amun-snapshot-engine-unified" }
amun-block-store = { path = "../amun-block-store" }
amun-replay-store = { path = "../amun-replay-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
