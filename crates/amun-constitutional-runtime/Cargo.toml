[package]
name = "amun-constitutional-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Constitutional runtime — unified execution pipeline with PCCV"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
amun-vm-kernel = { path = "../amun-vm-kernel" }
amun-evidence-engine = { path = "../amun-evidence-engine" }
amun-transition-proof = { path = "../amun-transition-proof" }
amun-bytecode = { path = "../amun-bytecode" }
amun-gas-engine = { path = "../amun-gas-engine" }
amun-invariant-engine = { path = "../amun-invariant-engine" }
amun-handle-resolver = { path = "../amun-handle-resolver" }
amun-cross-contract = { path = "../amun-cross-contract" }
amun-proof-archive = { path = "../amun-proof-archive" }
amun-pccv = { path = "../amun-pccv" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "2"
