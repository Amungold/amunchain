[package]
name = "amun-state-sync"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Cross-validator state sync protocol"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "2"
tempfile = "3"
