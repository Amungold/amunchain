[package]
name = "amun-benchmarks"
version = "0.1.0"
edition = "2021"
description = "Performance benchmarks for AmunChain components"
license = "MIT OR Apache-2.0"

[[bench]]
name = "consensus_bench"
harness = false

[[bench]]
name = "storage_bench"
harness = false

[[bench]]
name = "sync_bench"
harness = false

[dependencies]
amun-consensus-network = { path = "../amun-consensus-network" }
amun-chain-store = { path = "../amun-chain-store" }
amun-state-sync = { path = "../amun-state-sync" }
amun-resource-core = { path = "../amun-resource-core" }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
postcard = { version = "1", features = ["use-std"] }
rand = "0.8"
