[package]
name = "amun-consensus"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
thiserror = "1.0"
blake3 = "1.5"
hex = "0.4"
bincode = "1.3"
tempfile = "3.8"
crc32fast = "1.4"
rand = "0.8"
rayon = "1.10"

# Internal dependencies
amun-crypto = { path = "../amun-crypto" }
amun-constitution = { path = "../amun-constitution" }

[features]
default = ["std"]
std = []
