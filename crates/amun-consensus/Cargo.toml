[package]
name = "amun-consensus"
version = "1.0.0"
license = "MIT OR Apache-2.0"
edition = "2021"

[dependencies]
amun-constitutional-enforcement = { path = "../amun-constitutional-enforcement" }
amun-constitutional-commitments = { path = "../amun-constitutional-commitments" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
thiserror = "2"
blake3 = "1.5"
hex = "0.4"
postcard = "1"
tempfile = "3.8"
crc32fast = "1.4"
rand = "0.8"
rayon = "1.10"

# Internal dependencies
amun-crypto = { path = "../amun-crypto" }
amun-constitution = { path = "../amun-constitution" }

[features]
default = ["std"]
std = []
