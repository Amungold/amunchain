[package]
name = "amun_consensus"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["AmunChain Engineering"]
description = "Deterministic consensus execution semantics"
license = "Apache-2.0"

[lib]
crate-type = ["lib"]

[dependencies]
sha2 = "0.11"
hex = "0.4"
amun_consensus_math = { path = "../amun_consensus_math" }
amun_state_machine = { path = "../amun_state_machine" }

[dev-dependencies]

[profile.release]
lto = true
overflow-checks = true
opt-level = 3
