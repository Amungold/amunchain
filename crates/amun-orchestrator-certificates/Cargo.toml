[package]
name = "amun-orchestrator-certificates"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Certificate Authority — generate, verify, rotate validator certificates"

[dependencies]
amun-orchestrator-core = { path = "../amun-orchestrator-core" }
amun-networking = { path = "../amun-networking" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "time"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
