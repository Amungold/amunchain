[package]
name = "amun-chain-checkpoint"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "Chain checkpoint certificates for Proof-Carrying Chain"

[dependencies]
amun-stateless-sync = { path = "../amun-stateless-sync" }
amun-replay = { path = "../amun-replay" }
amun-constitutional-commitments = { path = "../amun-constitutional-commitments" }
amun-constitutional-state = { path = "../amun-constitutional-state" }
amun-constitutional-block = { path = "../amun-constitutional-block" }
amun-certificate-network = { path = "../amun-certificate-network" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake3 = "1"
