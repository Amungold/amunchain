[package]
name = "amun-consensus-network"
version = "0.1.0"
edition = "2021"
description = "Multi-validator live consensus over the network"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", features = ["use-std"] }
serde_json = "1.0.150"
blake3.workspace = true

[dev-dependencies]
blake3.workspace = true
postcard = "1"
serde_json = "1.0.150"
tempfile = "3"
