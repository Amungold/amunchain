[package]
name = "amun-validator-networking"
version = "0.1.0"
edition = "2021"
description = "Validator networking — peer discovery, state sync transport, rejoin protocol"
license = "MIT OR Apache-2.0"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
amun-state-sync = { path = "../amun-state-sync" }
amun-transition-proof = { path = "../amun-transition-proof" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "2"
rand = "0.8"
