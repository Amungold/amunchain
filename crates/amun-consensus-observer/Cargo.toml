[package]
name = "amun-consensus-observer"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "AmunChain Consensus Observability Layer - ADR-021"

[dependencies]
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
