[package]
name = "amun-sync"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "State synchronization and catch-up protocol for AmunChain"

[dependencies]
amun-chain-store = { path = "../amun-chain-store" }
amun-network-transport = { path = "../amun-network-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "1"
postcard = "1.1.3"
tempfile = "3.27.0"
amun-consensus-network = { version = "0.1.0", path = "../amun-consensus-network" }

[[bin]]
name = "backfill"
path = "src/bin/backfill.rs"

[[bin]]
name = "sync-server"
path = "src/bin/sync-server.rs"

[[bin]]
name = "gap-fill"
path = "src/bin/gap-fill.rs"

[[bin]]
name = "bootstrap"
path = "src/bin/bootstrap.rs"

[[bin]]
name = "snapshot-server"
path = "src/bin/snapshot-server.rs"

[[bin]]
name = "handshake"
path = "src/bin/handshake.rs"

[[bin]]
name = "rejoin"
path = "src/bin/rejoin.rs"


