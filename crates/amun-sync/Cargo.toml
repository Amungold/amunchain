[package]
name = "amun-sync"
version = "0.1.0"
edition = "2021"
description = "State synchronization and catch-up protocol for AmunChain"

[dependencies]
amun-chain-store = { path = "../amun-chain-store" }
amun-network-transport = { path = "../amun-network-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "1"
