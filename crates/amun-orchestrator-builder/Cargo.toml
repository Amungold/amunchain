[package]
name = "amun-orchestrator-builder"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Incremental builder engine — builds only changed crates using cargo metadata resolve graph"

[dependencies]
amun-orchestrator-core = { path = "../amun-orchestrator-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["process", "time"] }
async-trait = "0.1"
cargo_metadata = "0.18"
walkdir = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
