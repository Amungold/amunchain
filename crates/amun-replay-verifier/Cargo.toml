[package]
name = "amun-replay-verifier"
version = "0.1.0"
edition = "2021"
description = "Deterministic replay verification for constitutional contracts"
license = "MIT OR Apache-2.0"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
amun-transition-proof = { path = "../amun-transition-proof" }
amun-vm-kernel = { path = "../amun-vm-kernel" }
amun-evidence-engine = { path = "../amun-evidence-engine" }
amun-bytecode = { path = "../amun-bytecode" }
amun-constitutional-runtime = { path = "../amun-constitutional-runtime" }
amun-invariant-engine = { path = "../amun-invariant-engine" }
amun-proof-archive = { path = "../amun-proof-archive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "1"
