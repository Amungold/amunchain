[package]
name = "amun-orchestrator-validator"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Validator lifecycle manager — create, start, stop, remove validators"

[dependencies]
amun-orchestrator-core = { path = "../amun-orchestrator-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["process", "time", "fs"] }
async-trait = "0.1"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
