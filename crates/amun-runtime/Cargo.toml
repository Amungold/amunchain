[package]
name = "amun-runtime"
version = "1.0.0"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "Atomic overlay runtime with journaled state transitions"

[dependencies]
amun-storage = { path = "../amun-storage" }
amun-failure = { path = "../amun-failure" }
amun-kernel-types = { path = "../amun-kernel-types" }
amun-codec = { path = "../amun-codec" }
amun-block = { path = "../amun-block" }
amun-merkle = { path = "../amun-merkle" }
amun-constitution = { path = "../amun-constitution" }
amun-transaction = { path = "../amun-transaction" }
amun-stf = { path = "../amun-stf" }
heapless = "0.8"
blake3 = { version = "1.5", default-features = false }
