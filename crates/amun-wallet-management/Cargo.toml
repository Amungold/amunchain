[package]
name = "amun-wallet-management"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AmunChain wallet management — key generation, keystore, signing"

[dependencies]
ed25519-dalek = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
argon2 = "0.5"
