[package]
name = "amun-constitutional-block"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Constitutional block runtime: deterministic sequencing with Merkle commitments"

[dependencies]
amun-constitutional-state = { path = "../amun-constitutional-state" }
amun-consensus = { path = "../amun-consensus" }
amun-constitution-builder = { path = "../amun-constitution-builder" }
amun-constitutional-kernel = { path = "../amun-constitutional-kernel" }
amun-constitutional-commitments = { path = "../amun-constitutional-commitments" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
