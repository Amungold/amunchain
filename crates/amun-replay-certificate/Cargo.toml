[package]
name = "amun-replay-certificate"
version = "1.0.0"
edition = "2021"
description = "AmunChain replay certificate for cross-validator verification"

[dependencies]
amun-chain-position = { path = "../amun-chain-position" }
amun-protocol-event = { path = "../amun-protocol-event" }
blake3 = { version = "1.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
