[package]
name = "amun-operations"
version = "0.1.0"
edition = "2021"
description = "Production operations layer — health checks, metrics, backup, recovery"
license = "MIT OR Apache-2.0"

[dependencies]
amun-resource-core = { path = "../amun-resource-core" }
amun-state-sync = { path = "../amun-state-sync" }
amun-validator-networking = { path = "../amun-validator-networking" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
thiserror = "2"
