[package]
name = "amun-stateless-sync"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "Stateless synchronization using headers, certificates, and inclusion proofs"

[dependencies]
amun-constitutional-state = { path = "../amun-constitutional-state" }
amun-constitutional-block = { path = "../amun-constitutional-block" }
amun-certificate-network = { path = "../amun-certificate-network" }
amun-replay = { path = "../amun-replay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
